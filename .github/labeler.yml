# v6 配置：任一文件匹配任一路径时添加对应标签。
'@pkg/core':
  - changed-files:
      - any-glob-to-any-file: packages/vdataset/src/**

'@pkg/util':
  - changed-files:
      - any-glob-to-any-file: packages/vutils/src/**

# 测试目录包含 common、fixtures 等子目录。
test:
  - changed-files:
      - any-glob-to-any-file: packages/*/__tests__/**

docs:
  - changed-files:
      - any-glob-to-any-file: docs/**

eslint:
  - changed-files:
      - any-glob-to-any-file:
          - share/eslint-config/**
          - packages/*/.eslintrc.js

jest:
  - changed-files:
      - any-glob-to-any-file:
          - share/jest-config/**
          - packages/*/jest.config.js

typescript:
  - changed-files:
      - any-glob-to-any-file:
          - share/ts-config/**
          - packages/*/tsconfig.json
          - packages/*/tsconfig.eslint.json
          - packages/vscale/src/type.ts
          - packages/vutils/src/type.ts

bundler:
  - changed-files:
      - any-glob-to-any-file:
          - tools/bundler/**
          - packages/*/bundler.config.js

chore:
  - changed-files:
      - any-glob-to-any-file:
          - common/autoinstallers/**
          - common/git-hooks/**
          - common/scripts/**
